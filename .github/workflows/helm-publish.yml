# Publica o Helm chart do Agent Zero no repositório GitHub Pages.
# - Em push para a branch padrão com alterações em helm/: empacota e publica novas versões.
# - Configure GitHub Pages com source = branch gh-pages, pasta / (root).
# Ver: https://github.com/helm/chart-releaser-action

name: Publish Helm Chart

on:
  push:
    branches:
      - main
      - master
      - feat/add-helmchart
    paths:
      - 'helm/agent-zero/**'
      - '.github/workflows/helm-publish.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # Cria o branch gh-pages se não existir (chart-releaser exige que exista)
      - name: Ensure gh-pages branch exists
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if ! git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git reset --hard
            printf 'apiVersion: v1\nentries: {}\ngenerated: "%s"\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > index.yaml
            touch .nojekyll
            git add index.yaml .nojekyll
            git commit -m "chore: initialize gh-pages for Helm chart repo"
            git push origin gh-pages
            git checkout "${{ github.ref_name }}"
          fi

      - name: Configure Helm
        run: |
          helm version
          helm dependency update helm/agent-zero || true

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # .nojekyll + index.html: desativa Jekyll e evita 404 na URL raiz
      - name: Ensure .nojekyll and index.html on gh-pages
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${OWNER}.github.io/${REPO}"
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          touch .nojekyll
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Helm chart repo</title></head><body><h1>Helm chart repository</h1><p><a href="index.yaml">index.yaml</a></p><pre>helm repo add agent-zero '"$BASE_URL"'
helm repo update
helm install agent-zero agent-zero/agent-zero</pre></body></html>' > index.html
          git add .nojekyll index.html
          git diff --staged --quiet || (git commit -m "chore: add .nojekyll and index.html for GitHub Pages" && git push origin gh-pages)
          git checkout "${{ github.ref_name }}"

      # Coloca artifacthub-repo.yml na raiz de gh-pages para o Artifact Hub (Verified publisher)
      - name: Deploy artifacthub-repo.yml to gh-pages
        if: hashFiles('helm/artifacthub-repo.yml') != ''
        run: |
          cp helm/artifacthub-repo.yml /tmp/artifacthub-repo.yml
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout -b gh-pages
          cp /tmp/artifacthub-repo.yml .
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add artifacthub-repo.yml
          git diff --staged --quiet || (git commit -m "chore: update artifacthub-repo.yml" && git push origin gh-pages)
          git checkout "${{ github.ref_name }}"

      - name: Post Helm repo URL to summary
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO_URL="https://${OWNER}.github.io/${REPO}"
          {
            echo "## Helm chart published"
            echo ""
            echo "| Link | URL |"
            echo "|------|-----|"
            echo "| **Repositório Helm** | [$REPO_URL]($REPO_URL) |"
            echo "| **index.yaml** | [$REPO_URL/index.yaml]($REPO_URL/index.yaml) |"
            echo ""
            echo "### Como usar"
            echo '```bash'
            echo "helm repo add agent-zero $REPO_URL"
            echo "helm repo update"
            echo "helm install agent-zero agent-zero/agent-zero"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
